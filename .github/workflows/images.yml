name: Build images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  DOCKLE_IMAGE: goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9

jobs:
  lint:
    name: Lint ${{ matrix.service }} Dockerfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Hadolint
        run: |
          docker run --rm -i "${HADOLINT_IMAGE}" hadolint --failure-threshold warning - \
            < "apps/${{ matrix.service }}/Dockerfile"

  build:
    name: Build ${{ matrix.service }} for ${{ matrix.target.arch }}
    needs: lint
    # Fork pull requests get neither registry secrets nor package write access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        target:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # Provenance and SBOM attestations are disabled so the pushed digest is
      # the platform image manifest that the scan job inspects.
      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.service }}
          platforms: ${{ matrix.target.platform }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Scan ${{ matrix.service }} for ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests

      - id: image
        name: Resolve platform digest
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          digest="$(ls /tmp/digests)"
          echo "ref=ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}@sha256:${digest}" >> "$GITHUB_OUTPUT"
          mkdir -p reports

      - name: Generate Trivy report and SBOM
        env:
          REF: ${{ steps.image.outputs.ref }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trivy() {
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD/reports:/reports" \
              "${TRIVY_IMAGE}" "$@"
          }
          trivy image --image-src remote --format json --output /reports/trivy.json "${REF}"
          trivy image --image-src remote --format cyclonedx --output /reports/sbom.cdx.json "${REF}"

      - name: Generate Dockle report
        env:
          REF: ${{ steps.image.outputs.ref }}
          DOCKLE_USERNAME: ${{ github.actor }}
          DOCKLE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e DOCKLE_USERNAME -e DOCKLE_PASSWORD -v "$PWD/reports:/reports" \
            "${DOCKLE_IMAGE}" --format json --output /reports/dockle.json "${REF}"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.service }}-${{ matrix.arch }}
          path: reports/
          if-no-files-found: error
          retention-days: 7

      - name: Fail on fixable high or critical vulnerabilities
        env:
          REF: ${{ steps.image.outputs.ref }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image --image-src remote --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "${REF}"

      # Dockle reads the gunicorn "--access-logfile" flag as a credential key.
      - name: Fail on Dockle warnings
        env:
          REF: ${{ steps.image.outputs.ref }}
          DOCKLE_USERNAME: ${{ github.actor }}
          DOCKLE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ACCEPT_KEY: ${{ matrix.service == 'web' && '--accept-key=--access-logfile' || '' }}
        run: |
          docker run --rm -e DOCKLE_USERNAME -e DOCKLE_PASSWORD \
            "${DOCKLE_IMAGE}" --exit-code 1 --exit-level warn ${ACCEPT_KEY} "${REF}"

  publish:
    name: Publish ${{ matrix.service }} index
    needs: scan
    # Pull requests are built and scanned by digest but never tagged.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Create multi-platform index
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          MOVE_LATEST: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:sha-${GITHUB_SHA} already exists; commit tags are immutable."
            exit 1
          fi
          tags=(--tag "${IMAGE}:sha-${GITHUB_SHA}")
          if [ "${MOVE_LATEST}" = "true" ]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" $(printf "${IMAGE}@sha256:%s " *)

      - name: Record index
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          mkdir -p reports
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" | tee reports/index.txt
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          echo "${IMAGE}@${digest}" > reports/index-ref.txt

      - name: Upload index record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index-${{ matrix.service }}
          path: |
            reports/index.txt
            reports/index-ref.txt
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign ${{ matrix.service }} index
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index-${{ matrix.service }}
          path: /tmp/index

      - id: index
        name: Read index digest
        run: echo "ref=$(cat /tmp/index/index-ref.txt)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless: the certificate is issued for this workflow's GitHub OIDC identity.
      - name: Sign index and platform manifests
        env:
          REF: ${{ steps.index.outputs.ref }}
        run: cosign sign --yes --recursive "${REF}"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify index and runnable platform manifests
        env:
          REF: ${{ steps.index.outputs.ref }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          repo="${REF%@*}"
          children="$(docker buildx imagetools inspect --raw "${REF}" \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | .digest')"
          test "$(echo "${children}" | wc -l)" -eq 2
          for ref in "${REF}" $(printf "${repo}@%s " ${children}); do
            cosign verify \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${ref}" > /dev/null
            echo "verified ${ref}"
          done

  evidence:
    name: Upload image evidence
    needs: sign
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reports-*
          path: evidence

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: index-*
          path: evidence

      - name: Upload evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
